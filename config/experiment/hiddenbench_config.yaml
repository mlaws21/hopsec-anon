### Basic generic configs that are specific to the experiment. 
experiment_config:
  dataset: hiddenbench
  task_num: 65
  max_execution_times: 60
  max_hops: 60
  
  use_react: False

agent_defaults:
  executor_memory_limit: 10
  embedding_cache_limit: 1000
  router_memory_limit: 10
  decay_rate: 0.1
  decay_interval: 10
  router_retrieval_num: 3
  executor_retrieval_num: 3

agent_graph_config:
  graph_type: complete